name: imkon_crm
description: CRM-и Imkon Tower — идоракунии мизоҷон, мулкҳо ва сделкаҳо
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.3

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.1

  # UI / Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  intl: ^0.20.2

  # Utilities
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Суратҳо/иконаҳои лоиҳа (агар илова кунӣ)
  # assets:
  #   - assets/images/

  # Барои Playfair Display ва Inter, ё google_fonts (динамикӣ, интернет лозим)
  # ё шрифтҳоро локалӣ илова кун барои корношоямии офлайн:
  # fonts:
  #   - family: PlayfairDisplay
  #     fonts:
  #       - asset: assets/fonts/PlayfairDisplay-Medium.ttf
  #         weight: 500
